[project]
name = "lead-intel"
version = "0.1.0"
description = "AI Lead Research & Qualification - Intelligence Core"
readme = "README.md"
# CrewAI 1.x does not yet support Python 3.14.
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=1.15,<2",
    "tavily-python>=0.8,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0",
    # zoneinfo has no system timezone database on Windows.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
